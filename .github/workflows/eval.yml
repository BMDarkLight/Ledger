name: Eval

on:
  push:
    branches: [main]
  pull_request:

# The scorecard is committed back to main so the numbers in the README can
# never go stale. On pull requests the harness runs but nothing is committed.
permissions:
  contents: write

jobs:
  golden-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Fetch the corpus
        run: python -m scripts.fetch_corpus

      - name: Check the golden set against the corpus
        # Grounds every expected answer in real document text, so the metrics
        # below are not graded against remembered facts.
        run: pytest -m corpus

      - name: Run the golden set
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m eval.run_golden_set

      - name: Publish the scorecard to the job summary
        run: cat eval/scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the scorecard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/scorecard.md
          git diff --staged --quiet || git commit -m "chore(eval): refresh scorecard"
          git push
