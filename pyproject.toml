[project]
name = "ledger"
version = "0.0.0"
description = "Nothing enters the answer without a receipt."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Corpus tests need documents fetched from the network, so they are opt-in:
#   python -m scripts.fetch_corpus && pytest -m corpus
addopts = "-q -m 'not corpus'"
asyncio_mode = "auto"
markers = [
    "corpus: requires the fetched corpus on disk (see scripts/fetch_corpus.py)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
